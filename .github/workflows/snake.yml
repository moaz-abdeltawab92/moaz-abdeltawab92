name: Generate Snake Animation
on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write     
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Generate snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: moaz-abdeltawab92
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#7c3aed&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
      - name: Push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
